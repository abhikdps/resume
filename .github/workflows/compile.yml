name: Compile LaTeX

on:
  push:
    branches: [main]
    paths:
      - "**.tex"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Rename PDF
        run: mv resume.pdf Abhinav-Anand.pdf

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Abhinav-Anand.pdf
          git diff --staged --quiet || git commit -m "chore: update compiled PDF [skip ci]"
          git push
